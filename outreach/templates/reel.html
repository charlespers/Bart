<!doctype html>
<!--
  Bart Instagram Reel — HyperFrames composition (9:16, 1080x1920).

  render.py substitutes the WIDTH / HEIGHT / TOTAL_MS / AUDIO_SRC / SCENES
  placeholders below and renders this with
  `npx hyperframes render`. The data-* attributes follow HyperFrames'
  documented schema (data-composition-id / data-width / data-height on the
  root; <audio> with data-start / data-duration / data-track-index /
  data-volume). If a HyperFrames version expects a different schema, this is
  the one file to adjust — run `npx hyperframes preview` to iterate.

  Palette mirrors bart/branding.py (cream / ink / terracotta).
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap");

  * { margin: 0; padding: 0; box-sizing: border-box; }

  #root {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    position: relative;
    overflow: hidden;
    background: #f4f1ea;            /* CREAM */
    color: #221f1b;                 /* INK */
    font-family: "Inter", system-ui, sans-serif;
  }

  /* soft terracotta wash so the frame isn't flat cream */
  #root::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(120% 60% at 50% 0%, rgba(201,100,66,0.16), transparent 70%);
    pointer-events: none;
  }

  .wordmark {
    position: absolute; top: 88px; left: 0; right: 0;
    text-align: center;
    font-family: "Fraunces", serif;
    font-size: 64px; font-weight: 600;
    letter-spacing: -0.02em;
  }
  .wordmark .dot { color: #c96442; }   /* ACCENT */

  .footer {
    position: absolute; bottom: 96px; left: 0; right: 0;
    text-align: center;
    font-size: 38px; font-weight: 600;
    color: #c96442;
    letter-spacing: 0.01em;
  }

  .stage {
    position: absolute;
    top: 280px; bottom: 220px; left: 90px; right: 90px;
    display: flex; align-items: center; justify-content: center;
  }

  .hook, .scene {
    position: absolute;
    width: 100%;
    text-align: center;
    opacity: 0;
  }

  .hook {
    font-family: "Fraunces", serif;
    font-size: 104px; font-weight: 600; line-height: 1.05;
    letter-spacing: -0.02em;
    animation: pop var(--dur) ease both;
    animation-delay: var(--start);
  }

  .scene {
    font-size: 80px; font-weight: 600; line-height: 1.18;
    letter-spacing: -0.01em;
    animation: pop var(--dur) ease both;
    animation-delay: var(--start);
  }
  .scene .accent { color: #c96442; }

  @keyframes pop {
    0%   { opacity: 0; transform: translateY(40px); }
    12%  { opacity: 1; transform: translateY(0); }
    88%  { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-28px); }
  }
</style>
</head>
<body>
  <div id="root"
       data-composition-id="bart-reel"
       data-start="0"
       data-duration="{{TOTAL_MS}}"
       data-width="{{WIDTH}}"
       data-height="{{HEIGHT}}">

    <!-- baked-in audio track: TTS voiceover mixed with a music bed -->
    <audio src="{{AUDIO_SRC}}"
           data-start="0"
           data-duration="{{TOTAL_MS}}"
           data-track-index="0"
           data-volume="1"></audio>

    <div class="wordmark">bart<span class="dot">.</span></div>

    <div class="stage">
      {{SCENES}}
    </div>

    <div class="footer">studywithbart.com</div>
  </div>
</body>
</html>
