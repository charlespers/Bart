<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bart. — creator applications</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/tokens.css" />
<style>
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 28px 120px; }
  h1 { font-size: 30px; letter-spacing: -0.03em; margin: 0 0 6px; }
  .sub { color: var(--ink-mute); font-size: 14px; margin: 0 0 26px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab {
    font-family: var(--font-mono); font-size: 12px; cursor: pointer;
    padding: 7px 14px; border-radius: 999px; border: 1.5px solid var(--cream-edge);
    background: var(--cream-hi); color: var(--ink-mute);
  }
  .tab.on { border-color: var(--accent); color: var(--accent); }
  .app {
    background: var(--cream-hi); border: 1px solid var(--cream-edge);
    border-radius: 16px; padding: 20px 22px; margin-bottom: 14px;
  }
  .app .top { display: flex; justify-content: space-between; gap: 12px; }
  .app .name { font-weight: 700; font-size: 16px; }
  .app .email { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-mute); }
  .app .row { font-size: 13.5px; color: var(--ink-soft); margin-top: 8px; line-height: 1.5; }
  .app .row b { color: var(--ink-mute); font-weight: 600; }
  .app .pitch { margin-top: 10px; font-size: 14px; color: var(--ink-soft); line-height: 1.55; }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn {
    font-family: var(--font-sans); font-weight: 600; font-size: 13px;
    border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer;
  }
  .btn.approve { background: var(--accent); color: var(--cream-hi); }
  .btn.reject  { background: transparent; color: var(--ink-mute); box-shadow: inset 0 0 0 1.5px var(--cream-edge); }
  .pill {
    font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.07em; padding: 3px 9px; border-radius: 999px; align-self: flex-start;
  }
  .pill.pending  { background: var(--accent-tint); color: var(--accent-lo); }
  .pill.approved { background: #d8ecd0; color: #3f6b34; }
  .pill.rejected { background: #e6e0d0; color: var(--ink-mute); }
  .empty { color: var(--ink-mute); font-size: 14px; padding: 32px 0; }
  .note { font-size: 13px; margin-top: 10px; }
  .note.ok  { color: var(--ok); }
  .note.err { color: var(--accent-lo); }
  code { font-family: var(--font-mono); font-size: 12px; background: var(--cream-lo); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>creator applications</h1>
  <p class="sub">admin only — approve mints a referral code and emails the applicant their link. &nbsp;·&nbsp; <a href="/admin-codes">trial codes →</a></p>
  <div class="tabs">
    <div class="tab on" data-status="pending">pending</div>
    <div class="tab" data-status="approved">approved</div>
    <div class="tab" data-status="rejected">rejected</div>
  </div>
  <div id="list"><div class="empty">loading…</div></div>
</div>

<script>
(function () {
  var list = document.getElementById('list');
  var status = 'pending';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function load() {
    list.innerHTML = '<div class="empty">loading…</div>';
    fetch('/api/admin/creator-applications?status=' + status, { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 403) throw new Error('admin only — sign in as an admin account.');
        if (!r.ok) throw new Error('could not load (' + r.status + ').');
        return r.json();
      })
      .then(function (d) { render(d.applications || []); })
      .catch(function (e) { list.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
  }

  function render(apps) {
    if (!apps.length) {
      list.innerHTML = '<div class="empty">no ' + status + ' applications.</div>';
      return;
    }
    list.innerHTML = '';
    apps.forEach(function (a) {
      var el = document.createElement('div');
      el.className = 'app';
      var actions = status === 'pending'
        ? '<div class="actions">'
          + '<button class="btn approve" data-id="' + a.id + '">approve</button>'
          + '<button class="btn reject" data-id="' + a.id + '">reject</button>'
          + '</div><div class="note" data-note="' + a.id + '"></div>'
        : '';
      el.innerHTML =
        '<div class="top"><div>'
        + '<div class="name">' + esc(a.name) + '</div>'
        + '<div class="email">' + esc(a.email) + '</div>'
        + '</div><span class="pill ' + esc(a.status) + '">' + esc(a.status) + '</span></div>'
        + '<div class="row"><b>audience:</b> ' + (esc(a.audience) || '—') + '</div>'
        + '<div class="row"><b>links:</b> ' + (esc(a.links) || '—') + '</div>'
        + '<div class="pitch">' + (esc(a.pitch) || '—') + '</div>'
        + actions;
      list.appendChild(el);
    });
    list.querySelectorAll('.btn').forEach(function (b) {
      b.addEventListener('click', function () { decide(b.dataset.id, b.classList.contains('approve')); });
    });
  }

  function decide(id, approve) {
    var note = document.querySelector('[data-note="' + id + '"]');
    var verb = approve ? 'approve' : 'reject';
    fetch('/api/admin/creator-applications/' + id + '/' + verb, {
      method: 'POST', credentials: 'same-origin'
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, j: j }; });
    }).then(function (res) {
      if (res.ok) {
        if (note) {
          note.className = 'note ok';
          note.textContent = approve
            ? 'approved — referral code ' + (res.j.referral_code || '') + ' · applicant emailed'
            : 'rejected.';
        }
        setTimeout(load, 900);
      } else if (note) {
        note.className = 'note err';
        note.textContent = (res.j && res.j.detail) || 'failed.';
      }
    }).catch(function () {
      if (note) { note.className = 'note err'; note.textContent = 'network error.'; }
    });
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
      t.classList.add('on');
      status = t.dataset.status;
      load();
    });
  });

  load();
})();
</script>
</body>
</html>
