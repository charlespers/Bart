# fly.toml app configuration file generated for studywithbart on 2026-05-16T01:56:49-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'studywithbart'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'bart_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep one machine warm so deploys / hardware blips don't black out the site.
  # NOTE: do NOT raise this above 1 without first moving bart.db off SQLite
  # and the materials/output volume off Fly volumes — both are single-region,
  # single-machine attached and would corrupt under concurrent machines.
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
